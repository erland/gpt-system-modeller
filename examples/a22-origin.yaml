  type: Constraint
  name: Ingen direkt databasåtkomst mellan domäner
  abstraction_level: conceptual
  statement: En komponent får inte läsa eller skriva en annan domäns DataStore direkt.
  rationale: Bevarar ägarskap, förändringsbarhet och tydliga integrationsgränser.
