name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: system-modeller-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate release tag
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          tag = os.environ['GITHUB_EVENT_RELEASE_TAG_NAME']
          print(f"GitHub Release {tag} -> System Modeller {versioning.normalize_release(tag)}")
          PY

      - name: Run regression suite
        run: bash scripts/test.sh

      - name: Run final project hygiene gate
        run: python scripts/project_hygiene.py

      - name: Build release distributions
        run: python scripts/ci_build.py --output-dir dist

      - name: Resolve release version
        id: version
        run: |
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate runtime ZIP root layout
        run: python scripts/validate_runtime_zip_layout.py dist/*.zip

      - name: Validate GPT Builder runtime gates
        run: python scripts/validate_runtime_artifacts_1_5.py --version "${{ steps.version.outputs.release }}" --dir dist

      - name: Validate exact release asset set
        run: python scripts/validate_release_assets_1_5.py --version "${{ steps.version.outputs.release }}" --dir dist

      - name: Upload release build as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-release-${{ github.event.release.tag_name }}
          path: |
            dist/*.zip
            dist/runtime-parity.yaml
            dist/SHA256SUMS.txt
            dist/build-manifest.yaml
            dist/delivery-manifest.yaml
          if-no-files-found: error

      - name: Attach validated assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(python scripts/validate_release_assets_1_5.py --version "${{ steps.version.outputs.release }}" --dir dist --print-paths)
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" "${assets[@]}" --clobber
