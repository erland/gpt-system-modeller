name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt pytest
      - name: Regression and domain contract
        run: bash scripts/test.sh
      - name: Lint canonical project
        run: python scripts/lint_gpt_project.py --project-root .
      - name: Build five distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python scripts/build_distributions.py --project-root . --version "$VERSION"
      - name: Validate canonical distributions
        run: python scripts/validate_distributions.py --project-root .
      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f -name '*.zip' -print | sort)
          test "${#assets[@]}" -eq 6
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
