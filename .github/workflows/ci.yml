name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-modeller-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate instruction-adherence contract
        run: python scripts/validate_instruction_adherence.py --project-root .

      - name: Run regression suite
        run: bash scripts/test.sh

      - name: Run project hygiene gate
        run: python scripts/project_hygiene.py

      - name: Build CI distributions
        run: python scripts/ci_build.py --output-dir dist --release-version 0.0.0-ci

      - name: Validate runtime ZIP root layout
        run: python scripts/validate_runtime_zip_layout.py dist/system-modeller-chat-*.zip dist/system-modeller-custom-gpt-*.zip dist/system-modeller-claude-*.zip dist/system-modeller-opencode-*.zip dist/system-modeller-plugin-*.zip

      - name: Validate GPT Builder runtime gates
        run: python scripts/validate_runtime_artifacts_1_5.py --version 0.0.0-ci --dir dist

      - name: Validate exact delivery asset set
        run: python scripts/validate_release_assets_1_5.py --version 0.0.0-ci --dir dist

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-ci-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/runtime-parity.yaml
            dist/SHA256SUMS.txt
            dist/build-manifest.yaml
            dist/delivery-manifest.yaml
          if-no-files-found: error
