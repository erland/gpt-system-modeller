name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-modeller-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-abc:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: a, from: 1, to: 10}
          - {group: a, from: 11, to: 20}
          - {group: a, from: 21, to: 30}
          - {group: a, from: 31, to: 42}
          - {group: b, from: 1, to: 99}
          - {group: c, from: 1, to: 99}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - name: Verify migrated 1.6.25 replacement contracts
        run: python -m pytest -q tests/test_migration_1625.py
      - name: Standalone A/B/C scripts
        run: python scripts/run_abc_shard.py --group ${{ matrix.group }} --from-number ${{ matrix.from }} --to-number ${{ matrix.to }} --timeout 120 --output test-results/abc-${{ matrix.group }}-${{ matrix.from }}-${{ matrix.to }}.json
      - name: Upload individual results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abc-${{ matrix.group }}-${{ matrix.from }}-${{ matrix.to }}-results
          path: test-results/abc-${{ matrix.group }}-${{ matrix.from }}-${{ matrix.to }}.json
          if-no-files-found: warn
  behavior-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline-main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-ci.txt
      - name: Compare domain behavior and golden scenarios with main
        run: python scripts/compare_main_behavior.py --main-root baseline-main --pr-root . --output test-results/main-pr-behavior-parity.json
      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-pr-behavior-parity
          path: test-results/main-pr-behavior-parity.json
          if-no-files-found: error
  validate-and-build:
    needs: [standalone-abc, behavior-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate instruction-adherence contract
        run: python scripts/validate_instruction_adherence.py --project-root .

      - name: Run regression suite
        run: bash scripts/test.sh

      - name: Run project hygiene gate
        run: python scripts/project_hygiene.py

      - name: Remove generated test caches before lint
        run: |
          find . -type d \( -name __pycache__ -o -name .pytest_cache \) -prune -exec rm -rf {} +

      - name: Lint canonical 1.6.25 project
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/lint_gpt_project.py --project-root .

      - name: Build canonical runtime distributions
        run: python scripts/build_distributions.py --project-root . --version 0.0.0-ci

      - name: Validate canonical distributions
        run: python scripts/validate_distributions.py --project-root .

      - name: Verify Chat runtime file parity with main
        run: python scripts/verify_chat_main_parity.py --project-root . --version 0.0.0-ci

      - name: Execute unpacked System Modeller runtime validators
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m pytest -q tests/test_runtime_resource_layout.py

      - name: Verify Work Engine ZIP and fallback contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/verify_system_modeller_engine.py --version 0.0.0-ci

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-ci-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
