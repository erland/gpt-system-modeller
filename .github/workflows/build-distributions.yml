name: Verify and publish distributions

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-modeller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate instruction-adherence contract
        run: python scripts/validate_instruction_adherence.py --project-root .

      - name: Run regression suite
        run: bash scripts/test.sh

  build-check:
    name: Build and validate distributions
    needs: verify
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Build unified project and runtime artifacts
        run: python scripts/ci_build.py --output-dir dist

      - name: Validate generated runtime ZIPs again
        run: |
          DIST_VERSION=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().distribution_version)
          PY
          )
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          python scripts/validate_custom_gpt.py             --custom "dist/system-modeller-custom-gpt-v${RELEASE}.zip"             --chat "dist/system-modeller-chat-v${RELEASE}.zip"             --expected-version "${DIST_VERSION}"
          python scripts/validate_claude.py             --claude "dist/system-modeller-claude-v${RELEASE}.zip"
          python scripts/validate_opencode.py             --opencode "dist/system-modeller-opencode-v${RELEASE}.zip"

      - name: Validate GPT Builder 1.5 runtime gates
        run: |
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          python scripts/validate_gpt_builder_1_5_contract.py
          python scripts/validate_runtime_distribution_registry.py
          python scripts/validate_openai_plugin_1_5_assessment.py
          python scripts/validate_chat_gpt_builder_1_5.py --artifact "dist/system-modeller-chat-v${RELEASE}.zip"
          python scripts/validate_custom_gpt_builder_1_5.py --artifact "dist/system-modeller-custom-gpt-v${RELEASE}.zip"
          python scripts/validate_claude_gpt_builder_1_5.py --artifact "dist/system-modeller-claude-v${RELEASE}.zip"
          python scripts/validate_opencode_gpt_builder_1_5.py --artifact "dist/system-modeller-opencode-v${RELEASE}.zip"

      - name: Validate exact registry asset set
        run: |
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          python scripts/validate_release_assets_1_5.py --version "${RELEASE}" --dir dist

      - name: Upload unified build
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-unified-build
          path: |
            dist/*.zip
            dist/runtime-parity.yaml
            dist/SHA256SUMS.txt
            dist/build-manifest.yaml
          if-no-files-found: error

  release:
    name: Build and publish release assets
    needs: verify
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate release tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          tag = os.environ['GITHUB_EVENT_RELEASE_TAG_NAME']
          release = versioning.normalize_release(tag)
          print(f'GitHub Release {tag} -> System Modeller {release}')
          PY

      - name: Build unified release artifacts
        run: python scripts/ci_build.py --output-dir dist

      - name: Validate release runtime ZIPs
        run: |
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          python scripts/validate_custom_gpt.py             --custom "dist/system-modeller-custom-gpt-v${RELEASE}.zip"             --chat "dist/system-modeller-chat-v${RELEASE}.zip"             --expected-version "${RELEASE}"
          python scripts/validate_claude.py             --claude "dist/system-modeller-claude-v${RELEASE}.zip"
          python scripts/validate_opencode.py             --opencode "dist/system-modeller-opencode-v${RELEASE}.zip"

      - name: Validate exact release asset set
        run: |
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          python scripts/validate_release_assets_1_5.py --version "${RELEASE}" --dir dist

      - name: Upload release build as Actions artifact
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-release-${{ github.event.release.tag_name }}
          path: |
            dist/*.zip
            dist/runtime-parity.yaml
            dist/SHA256SUMS.txt
            dist/build-manifest.yaml
          if-no-files-found: error

      - name: Attach unified assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          mapfile -t assets < <(python scripts/validate_release_assets_1_5.py --version "${RELEASE}" --dir dist --print-paths)
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" "${assets[@]}" --clobber
