name: Verify and publish distributions

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-modeller-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Run regression suite
        run: bash scripts/test.sh

  build-check:
    name: Build and validate distributions
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Build Chat and Custom GPT distributions
        run: python scripts/ci_build.py --output-dir dist

      - name: Validate generated distributions again from ZIP files
        run: |
          DIST_VERSION=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().distribution_version)
          PY
          )
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          python scripts/validate_custom_gpt.py \
            --custom "dist/system-modeller-custom-gpt-v${RELEASE}.zip" \
            --chat "dist/system-modeller-chat-v${RELEASE}.zip" \
            --expected-version "${DIST_VERSION}"

      - name: Upload Chat distribution
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-chat
          path: dist/system-modeller-chat-v*.zip
          if-no-files-found: error

      - name: Upload Custom GPT distribution
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-custom-gpt
          path: dist/system-modeller-custom-gpt-v*.zip
          if-no-files-found: error

      - name: Upload build manifest
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-build-manifest
          path: dist/build-manifest.yaml
          if-no-files-found: error

  release:
    name: Build and publish release assets
    needs: verify
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt

      - name: Validate release tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          tag = os.environ['GITHUB_EVENT_RELEASE_TAG_NAME']
          release = versioning.normalize_release(tag)
          print(f'GitHub Release {tag} -> System Modeller {release}')
          PY

      - name: Build release distributions
        run: python scripts/ci_build.py --output-dir dist

      - name: Validate release distributions
        run: |
          RELEASE=$(python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import versioning
          print(versioning.resolve().release_version)
          PY
          )
          python scripts/validate_custom_gpt.py \
            --custom "dist/system-modeller-custom-gpt-v${RELEASE}.zip" \
            --chat "dist/system-modeller-chat-v${RELEASE}.zip" \
            --expected-version "${RELEASE}"

      - name: Upload release build as Actions artifacts
        uses: actions/upload-artifact@v7
        with:
          name: system-modeller-release-${{ github.event.release.tag_name }}
          path: |
            dist/system-modeller-chat-v*.zip
            dist/system-modeller-custom-gpt-v*.zip
            dist/build-manifest.yaml
          if-no-files-found: error

      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_EVENT_RELEASE_TAG_NAME}" \
            dist/system-modeller-chat-v*.zip \
            dist/system-modeller-custom-gpt-v*.zip \
            dist/build-manifest.yaml \
            --clobber
