metamodel:
  id: system-modeller-information-usage
  version: 0.1.0-dev.13
  status: normative
  purpose: Informationsanvändningsmodell för Plan A steg A9. Beskriver hur arkitekturelement
    skapar, läser, uppdaterar, tar bort, äger, mastrar, lagrar och utbyter konceptuella
    informationsobjekt.
