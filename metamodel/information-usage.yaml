rules:
- id: INFOUSE-SEM-001
  statement: Informationsanvändning modelleras som explicit relation till InformationObject
    när accessens eller ansvarets semantik är känd.
- id: INFOUSE-SEM-002
  statement: UseCase.related_information får användas som enkel relevanslista, men
    specifik create/read/update/delete-semantik uttrycks med informationsanvändningsrelationer.
- id: INFOUSE-SEM-003
  statement: Source är det arkitekturelement som utför handlingen eller bär ansvaret;
    target är InformationObject.
- id: INFOUSE-SEM-004
  statement: Relationerna ska avse konceptuell information och får inte användas som
    ersättning för kod- eller databasberoenden.
- id: INFOUSE-SEM-005
  statement: Par till Component och Service är aktiva från A10, API från A11 och DataStore
    från A13.
