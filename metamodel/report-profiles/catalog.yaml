report_profiles:
  version: 1
  default_profile: standard
  user_selectable: false
  profiles:
    - id: overview
      status: planned
      implemented: false
      user_selectable: false
      purpose: Future concise architecture overview with fewer sections and lower narrative detail.
    - id: standard
      status: stable
      implemented: true
